# Catálogo de modelos por alias lógico (dossier §1.1, condición C4 y riesgo R8).
# Los IDs reales son configurables: verificar disponibilidad en la Gemini API / `claude --help` en el Sprint 1.
# rpm/rpd = límites del free tier de Gemini. Solo el de gemini-3.8-flash está confirmado (20 RPD, mensaje 429 del
# 2026-10-23); el resto son provisionales. Si se agotan, GeminiClient lo detecta por el 429 y salta ese modelo
# hasta la hora de reinicio que indica la API.
#
# Medición del 2026-10-23 (prompt de ~3.000 tokens): gemini-3.5-flash 4–6 s; gemini-3.8-flash 128 s (cola del
# free tier) y 503 frecuentes. Por eso el Flash principal es 3.5 y el 3.8 queda como último recurso.

[models.gemini_flash]
provider = "gemini"
model_id = "gemini-3.5-flash"
efforts = ["low", "medium", "high"]
rpm = 10
rpd = 250
timeout_s = 90
fallbacks = ["gemini_flash_lite"]

[models.gemini_flash_lite]
provider = "gemini"
model_id = "gemini-3.5-flash-lite"
efforts = ["low", "medium", "high"]
rpm = 15
rpd = 500
timeout_s = 90
fallbacks = ["gemini_flash_38"]

[models.gemini_flash_38]
# Modelo indicado en el dossier; lento y con solo 20 peticiones/día en el free tier.
provider = "gemini"
model_id = "gemini-3.8-flash"
efforts = ["low", "medium", "high"]
rpm = 5
rpd = 20
timeout_s = 240
fallbacks = []

[models.gemini_top]
# "Gemini 4 Argon": solo si existe en la Gemini API; si no, el router degrada a claude_opus.
provider = "gemini"
model_id = "gemini-4-argon"
efforts = ["low", "medium", "high"]
rpm = 5
rpd = 100
timeout_s = 300
fallbacks = ["claude_opus"]

[models.gemini_embedding]
provider = "gemini"
model_id = "gemini-embedding-001"
output_dimensionality = 768
rpm = 100
rpd = 1000
timeout_s = 30
fallbacks = []

[models.claude_haiku]
provider = "claude"
cli_model = "haiku"
efforts = ["low", "medium", "high"]
timeout_s = 60
fallbacks = ["gemini_flash"]

[models.claude_sonnet]
provider = "claude"
cli_model = "sonnet"
efforts = ["low", "medium", "high"]
timeout_s = 120
fallbacks = ["gemini_flash"]

[models.claude_opus]
provider = "claude"
cli_model = "opus"
efforts = ["low", "medium", "high"]
timeout_s = 300
fallbacks = ["claude_sonnet", "gemini_flash"]

[circuit_breaker]
# Tras un "usage limit" de Claude: abierto hasta reset_at informado o este valor por defecto.
default_open_minutes = 60
gemini_max_retries = 3
