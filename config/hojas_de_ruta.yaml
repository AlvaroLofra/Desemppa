  SOC_MODIFICACION_MOVILIDAD:
    - titulo: "Plazo de caducidad de veinte días hábiles"
      que_hacer: >-
        La demanda contra la modificación sustancial o movilidad debe presentarse en el plazo de caducidad de veinte
        días hábiles siguientes a la notificación por escrito de la decisión empresarial.
      quien: tu
      base:
        - {norma: LRJS, articulo: "138", cita: "La demanda deberá presentarse en el plazo de caducidad de los veinte días hábiles siguientes a la notificación por escrito de la decisión a los trabajadores o a sus representantes"}
      plazo: SOC_MODIFICACION_20H
    - comun: conciliacion_social
    - comun: demanda_social
  SOC_CONCILIACION_EXCEDENCIA:
    - titulo: "Plazo de veinte días ante la negativa de la empresa"
      que_hacer: >-
        Para los derechos de conciliación de la vida personal, familiar y laboral dispones de un plazo de veinte días
        desde que la empresa te comunique su negativa o disconformidad para presentar demanda en el Juzgado de lo
        Social.
      quien: tu
      base:
        - {norma: LRJS, articulo: "139", cita: "El trabajador dispondrá de un plazo de veinte días, a partir de que el empresario le comunique su negativa o su disconformidad con la propuesta realizada por el trabajador, para presentar demanda ante el Juzgado de lo Social"}
      plazo: SOC_VACACIONES_20H
    - comun: conciliacion_social
    - comun: demanda_social
