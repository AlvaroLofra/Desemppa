  SOC_SEGURIDAD_SOCIAL_PRESTACIONES:
    - titulo: "Reclamación administrativa previa en treinta días"
      que_hacer: >-
        Antes de demandar en materia de prestaciones de Seguridad Social es obligatorio presentar una reclamación
        previa ante la Entidad gestora en el plazo de treinta días desde la notificación de la resolución (u once días
        en determinadas altas médicas).
      quien: tu
      base:
        - {norma: LRJS, articulo: "71", cita: "Será requisito necesario para formular demanda en materia de prestaciones de Seguridad Social, que los interesados interpongan reclamación previa ante la Entidad gestora de las mismas"}
        - {norma: LRJS, articulo: "71", cita: "La reclamación previa deberá interponerse ante el órgano competente que haya dictado resolución sobre la solicitud inicial del interesado, en el plazo de treinta días desde la notificación de la misma"}
        - {norma: LRJS, articulo: "71", cita: "la reclamación previa se interpondrá en el plazo de once días desde la notificación de la resolución"}
      plazo: SOC_RECLAMACION_PREVIA_SS_30H
    - comun: demanda_social
  ADM_RESPONSABILIDAD_PATRIMONIAL:
    - titulo: "Reclamación de responsabilidad patrimonial en el plazo de un año"
      que_hacer: >-
        El derecho a reclamar prescribe al año de producido el hecho o manifestarse su efecto lesivo; si hay daños
        físicos o psíquicos, el plazo empieza a contarse desde la curación o la determinación del alcance de las
        secuelas.
      quien: tu
      base:
        - {norma: LPAC, articulo: "67", cita: "El derecho a reclamar prescribirá al año de producido el hecho o el acto que motive la indemnización o se manifieste su efecto lesivo"}
        - {norma: LPAC, articulo: "67", cita: "En caso de daños de carácter físico o psíquico a las personas, el plazo empezará a computarse desde la curación o la determinación del alcance de las secuelas"}
      plazo: ADM_RESP_PATRIMONIAL_1A
    - comun: reposicion_y_contencioso
