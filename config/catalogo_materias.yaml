    plazos: [ADM_TRAFICO_ALEGACIONES_20N]
    notas: "Si no alegas ni pagas en 20 días naturales, en las infracciones leves la denuncia pasa a valer como resolución (art. 95.4 LTSV). Contra la resolución cabe recurso de reposición en el plazo de un mes desde su notificación (art. 96.2 LTSV)."
    terminos_cendoj: ["sanción tráfico estacionamiento regulado notificación"]
    competencia_local: true
