    campos_criticos: ["fecha de notificación del despido", "motivos de la carta", "antigüedad", "salario bruto"]
    plazos: [SOC_DESPIDO_CADUCIDAD]
    terminos_cendoj: ["despido disciplinario improcedente", "carta de despido insuficiente"]
