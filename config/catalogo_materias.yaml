    campos_criticos: ["fecha de entrega de llaves", "importe de la fianza", "estado de la vivienda a la entrada (fotos o inventario)"]
    plazos: [CIV_FIANZA_DEVOLUCION_1M, CIV_CONTRACTUAL_5A]
    terminos_cendoj: ["devolución fianza", "desgaste uso ordinario", "pintura vivienda arrendada"]
    cji: true
  SOC_DESPIDO_IT:
    descripcion: "Me despiden estando de baja médica"
    jurisdiccion: social
    procedimiento: despido
