    campos_criticos: ["fecha del acuerdo o de su notificación", "¿estás al corriente de pago?", "¿es contrario a la ley o los estatutos?"]
    opciones_campos: {"¿es contrario a la ley o los estatutos?": ["A la ley", "A los estatutos", "A las dos cosas", "A ninguna de las dos"]}
