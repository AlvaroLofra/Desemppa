    normas_forales:
      CT:
        quita: [LPH]
        anade: [{norma: CCCAT_L5, articulos: ["553-38", "553-40"]}, {norma: CCCAT_L1, articulos: ["121-21"]}]
    campos_criticos: ["fecha del daño", "origen (elemento privativo o común)", "importe de la reparación"]
    plazos: [CIV_EXTRACONTRACTUAL_1A]
    terminos_cendoj: ["daños por agua vecino responsabilidad extracontractual"]
