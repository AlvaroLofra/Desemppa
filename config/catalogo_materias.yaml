# Catálogo cerrado de submaterias (dossier §4.1). El triaje SOLO puede elegir claves de aquí; las normas
# y plazos los añade el código de forma determinista. PENDIENTE DE VALIDACIÓN JURÍDICA.
# normas: alias de config/catalogo_normas.json + artículos (número tal como aparece en la ley).
submaterias:
