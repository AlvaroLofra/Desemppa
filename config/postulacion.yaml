# Reglas de postulación (dossier §1.3.2). PENDIENTE DE VALIDACIÓN JURÍDICA.
# Texto MASC redactado el 24-10-2026 contra el texto consolidado de la LO 1/2025 (BOE-A-2025-76, arts. 2, 5 y 10).
# Excepciones del art. 5.2-5.3 (derechos fundamentales, art. 158 CC, apoyos a la discapacidad, filiación, tutela
# sumaria de la posesión, obra ruinosa, menores, juicio cambiario, demanda ejecutiva, medidas cautelares previas,
# diligencias preliminares, jurisdicción voluntaria salvo excepciones, monitorio europeo y escasa cuantía europeo)
# NO se evalúan aquí: el texto avisa en general.
# Se evalúan en orden; gana la primera regla cuyo "si" se cumple.
# Campos de entrada: jurisdiccion, procedimiento, fase, cuantia_eur, funcionario_personal (bool).
umbral_eur: 2000

reglas:
  - id: CIV_MONITORIO_INICIAL
    si: {jurisdiccion: civil, procedimiento: monitorio, fase: inicial}
    abogado: false
    procurador: false
    bloquea_escritos: false
    base_legal: "Art. 814.2 LEC; arts. 5 y 10 LO 1/2025"
    texto: "La petición inicial de un monitorio puede presentarse sin abogado ni procurador, sea cual sea la cuantía. Si la otra parte se opone y la deuda supera 2.000 €, necesitarás abogado y procurador. El monitorio no está entre las excepciones del requisito de negociación previa de la LO 1/2025 (sí lo están el juicio cambiario y el monitorio europeo). Antes de demandar, la LO 1/2025 (art. 5) exige haber intentado negociar (mediación, conciliación, oferta vinculante confidencial o negociación directa entre las partes) y poder acreditarlo por escrito (art. 10): basta un documento firmado por ambas partes o, en su defecto, uno que pruebe que la otra parte recibió tu invitación o propuesta para negociar y pudo leerla entera (p. ej., burofax con certificación de contenido). Si no contesta en 30 días naturales desde que la recibe, el intento se da por terminado sin acuerdo."
  - id: CIV_HASTA_UMBRAL
    si: {jurisdiccion: civil, cuantia_max: 2000}
    abogado: false
    procurador: false
    bloquea_escritos: false
    base_legal: "Arts. 23.2.1º y 31.2.1º LEC; arts. 5 y 10 LO 1/2025"
    texto: "En asuntos civiles de hasta 2.000 € puedes actuar por ti mismo, sin abogado ni procurador. Antes de demandar, la LO 1/2025 (art. 5) exige haber intentado negociar (mediación, conciliación, oferta vinculante confidencial o negociación directa entre las partes) y poder acreditarlo por escrito (art. 10): basta un documento firmado por ambas partes o, en su defecto, uno que pruebe que la otra parte recibió tu invitación o propuesta para negociar y pudo leerla entera (p. ej., burofax con certificación de contenido). Si no contesta en 30 días naturales desde que la recibe, el intento se da por terminado sin acuerdo."
  - id: CIV_SOBRE_UMBRAL
    si: {jurisdiccion: civil, cuantia_min_exclusiva: 2000}
    abogado: true
    procurador: true
    bloquea_escritos: true
    base_legal: "Arts. 23 y 31 LEC; arts. 5 y 10 LO 1/2025"
    texto: "Este asunto supera los 2.000 €: la ley exige abogado y procurador. La herramienta te informa, pero no redactará escritos para el juzgado. Antes de demandar, la LO 1/2025 (art. 5) exige haber intentado negociar (mediación, conciliación, oferta vinculante confidencial o negociación directa entre las partes) y poder acreditarlo por escrito (art. 10): basta un documento firmado por ambas partes o, en su defecto, uno que pruebe que la otra parte recibió tu invitación o propuesta para negociar y pudo leerla entera (p. ej., burofax con certificación de contenido). Si no contesta en 30 días naturales desde que la recibe, el intento se da por terminado sin acuerdo."
  - id: CIV_CUANTIA_DESCONOCIDA
    si: {jurisdiccion: civil}
    abogado: true
    procurador: true
    bloquea_escritos: true
    base_legal: "Arts. 23 y 31 LEC; arts. 5 y 10 LO 1/2025"
    texto: "Sin cuantía conocida, se asume que puede superar 2.000 € y exigir abogado y procurador. Antes de demandar, la LO 1/2025 (art. 5) exige haber intentado negociar (mediación, conciliación, oferta vinculante confidencial o negociación directa entre las partes) y poder acreditarlo por escrito (art. 10): basta un documento firmado por ambas partes o, en su defecto, uno que pruebe que la otra parte recibió tu invitación o propuesta para negociar y pudo leerla entera (p. ej., burofax con certificación de contenido). Si no contesta en 30 días naturales desde que la recibe, el intento se da por terminado sin acuerdo."
  - id: SOC_RECURSO
    si: {jurisdiccion: social, fase: recurso}
    abogado: true
    procurador: false
    bloquea_escritos: true
    base_legal: "Art. 21 LRJS"
    texto: "Para recurrir en suplicación o casación necesitas abogado (o graduado social en suplicación)."
  - id: SOC_INSTANCIA
    si: {jurisdiccion: social}
    abogado: false
    procurador: false
    bloquea_escritos: false
    base_legal: "Arts. 18 y 21 LRJS"
    texto: "En la primera instancia social puedes comparecer por ti mismo, aunque es muy recomendable contar con abogado, graduado social o sindicato. Antes de la demanda es obligatoria la papeleta de conciliación (SMAC)."
  - id: ADM_VIA_ADMINISTRATIVA
    si: {jurisdiccion: administrativa_previa}
    abogado: false
    procurador: false
    bloquea_escritos: false
    base_legal: "Ley 39/2015"
    texto: "Las alegaciones y los recursos administrativos (reposición, alzada) no requieren abogado."
  - id: CA_FUNCIONARIO_PERSONAL
    si: {jurisdiccion: contencioso, funcionario_personal: true}
    abogado: false
    procurador: false
    bloquea_escritos: false
    base_legal: "Art. 23.3 LJCA"
    texto: "Como funcionario en una cuestión de personal que no implica separación, puedes comparecer por ti mismo."
  - id: CA_GENERAL
    si: {jurisdiccion: contencioso}
    abogado: true
    procurador: false
    bloquea_escritos: true
    base_legal: "Art. 23 LJCA"
    texto: "El recurso contencioso-administrativo exige con carácter general abogado (y procurador ante órganos colegiados)."
  - id: PENAL
    si: {jurisdiccion: penal}
    abogado: true
    procurador: false
    bloquea_escritos: true
    base_legal: "Arts. 118 y 767 LECrim"
    texto: "Para presentar una denuncia inicial ante la Policía, Guardia Civil o el juzgado de guardia no necesitas abogado ni procurador, pero para intervenir como acusación particular o como investigado en el procedimiento penal la ley exige abogado y procurador (salvo determinados delitos leves). La herramienta te informa con los artículos vigentes del Código Penal y de la LECrim, pero no redacta escritos procesales penales: consulta a un abogado o solicita asistencia jurídica gratuita."
  - id: POR_DEFECTO
    si: {}
    abogado: true
    procurador: false
    bloquea_escritos: true
    base_legal: "—"
    texto: "No se ha podido determinar si necesitas abogado: consúltalo antes de presentar nada."
