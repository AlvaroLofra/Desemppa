# Proveedores de modelos (Planes de Suscripción vía CLI y APIs por Clave de todas las grandes compañías).
#
# modalidad:
#   "plan"  Suscripción plana mensual (invocación por CLI local sin coste extra por token)
#   "api"   API oficial de pago por uso (mediante clave en .env o guardada cifrada desde la interfaz web)
#
# tipo:
#   "cli"            CLI local no interactivo (Antigravity, Claude Code, Codex…)
#   "api_gemini"     Google Gemini API (AI Studio)
#   "api_anthropic"  Anthropic Messages API
#   "api_openai"     OpenAI Chat Completions API y compatibles (OpenAI, xAI/Grok, DeepSeek, Mistral, OpenRouter)

# ==================== PLANES / SUSCRIPCIONES (0 € EXTRA POR TOKEN) ====================

[providers.antigravity_cli]
tipo = "cli"
compania = "Google"
modalidad = "plan"
etiqueta = "Antigravity (Suscripción Google AI Pro)"
ejecutable = "agy"
args = ["--model", "{model}", "--input-format", "stream-json", "--output-format", "stream-json",
        "--disable-slash-commands", "--print-timeout", "{timeout_inner}s", "-p="]
system_prompt = "inline"
stdin = "agy_ndjson"
parser = "agy_stream_json"
json_schema_args = ["--json-schema", "{schema_file}"]
descubrir = ["models"]
modelos_conocidos = [
    "gemini-4-argon-low", "gemini-4-argon-medium", "gemini-4-argon-high",
    "gemini-3.8-flash-low", "gemini-3.8-flash-medium", "gemini-3.8-flash-high",
    "claude-opus-5-5-low", "claude-opus-5-5-medium", "claude-opus-5-5-high",
    "claude-sonnet-5-5-low", "claude-sonnet-5-5-medium", "claude-sonnet-5-5-high",
    "gpt-oss-120b-medium"
]
login = "Abre Antigravity o ejecuta `agy` en una terminal e inicia sesión con tu cuenta de Google AI Pro."

[providers.claude_cli]
tipo = "cli"
compania = "Anthropic"
modalidad = "plan"
etiqueta = "Claude Code (Suscripción Claude Pro)"
ejecutable = "claude"
args = ["-p", "--model", "{model}", "--effort", "{effort}", "--output-format", "stream-json", "--verbose",
        "--include-partial-messages", "--tools", "", "--no-session-persistence"]
system_prompt = "file"
system_prompt_args = ["--system-prompt-file", "{system_file}"]
stdin = "text"
parser = "claude_stream_json"
modelos_conocidos = ["haiku", "sonnet", "opus"]
login = "Abre una terminal, ejecuta `claude` y escribe /login."

[providers.codex_cli]
tipo = "cli"
compania = "OpenAI"
modalidad = "plan"
etiqueta = "Codex CLI (Suscripción ChatGPT Plus/Pro)"
habilitado = false
ejecutable = "codex"
args = ["exec", "--json", "--model", "{model}", "--skip-git-repo-check", "--sandbox", "read-only", "-"]
system_prompt = "inline"
stdin = "text"
parser = "codex_jsonl"
modelos_conocidos = ["gpt-5-codex"]
login = "Instala el CLI (`npm i -g @openai/codex`), ejecuta `codex` e inicia sesión con tu cuenta de ChatGPT."

# ==================== APIS POR CLAVE (TODAS LAS GRANDES COMPAÑÍAS) ====================

[providers.gemini_api]
tipo = "api_gemini"
compania = "Google"
modalidad = "api"
etiqueta = "Google Gemini API (AI Studio)"
api_key_env = "GEMINI_API_KEY"
modelos_conocidos = ["gemini-3.8-flash", "gemini-4-argon"]
login = "Configura tu clave desde el botón «Clave API» en la web o define GEMINI_API_KEY en .env."

[providers.anthropic_api]
tipo = "api_anthropic"
compania = "Anthropic"
modalidad = "api"
etiqueta = "Anthropic API (Claude Directo)"
base_url = "https://api.anthropic.com/v1"
api_key_env = "ANTHROPIC_API_KEY"
modelos_conocidos = ["claude-sonnet-5-5", "claude-opus-5-5", "claude-haiku-5-5"]
login = "Configura tu clave desde el botón «Clave API» en la web o define ANTHROPIC_API_KEY en .env."

