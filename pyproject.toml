[project]
name = "iuris-ia"
version = "0.0.1"
description = "IURIS-IA / LEX-AGENT ES — asistente legal personal local (derecho español)"
readme = "docs/IURIS_IA_Dossier_Planificacion_v3.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "pydantic>=2.0",
    "google-genai",
    "lancedb",
    "pyarrow",
    "rapidfuzz",
    "httpx",
    "lxml",
    "pdfplumber",
    "filelock",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["generate_unified_master_pdf.py", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["core", "connectors"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: llama a servicios reales (red, Gemini, Claude CLI); ejecución manual",
]
addopts = "-m 'not live'"
