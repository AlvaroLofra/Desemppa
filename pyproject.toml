[project]
name = "iuris-ia"
version = "0.0.1"
description = "IURIS-IA / LEX-AGENT ES — asistente legal personal local (derecho español)"
readme = "docs/IURIS_IA_Dossier_Planificacion_v3.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "pydantic>=2.0",
    "google-genai",
    "lancedb",
    "pyarrow",
    "rapidfuzz",
    "httpx",
    "lxml",
    "pdfplumber",
    "filelock",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "python-multipart>=0.0.32",
    "segno==1.6.6",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-pyyaml>=6.0.12.20260906",
    "openpyxl>=3.1.5",
    "playwright>=1.64.1",
    "pytest-timeout>=2.4.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["generate_unified_master_pdf.py", "web", "docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["core", "connectors", "scripts", "api"]
strict = true

[[tool.mypy.overrides]]
module = ["lxml.*", "pyarrow.*", "lancedb.*", "pdfplumber.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: llama a servicios reales (red, Gemini, Claude CLI); ejecución manual",
    "e2e: navegador real (Playwright/Chromium) contra el servidor con LLM simulado",
]
addopts = "-m 'not live and not e2e'"

[tool.ruff.lint.per-file-ignores]
"api/main.py" = ["B008"]  # File()/Query()/Header() en defaults es el patrón estándar de FastAPI
